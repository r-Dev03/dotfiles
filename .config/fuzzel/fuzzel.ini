[main]
icon-theme=Adwaita
font=Rec Mono Casual:size=14
width=60
lines=15
prompt=
terminal=wezterm
normal-window=true
dmenu-mode=false

[colors]
background=101317ee        # Darkest background, slightly transparent
text=E4E1DDff              # Light, readable text
selection=22232Eff         # Slightly lighter for selection
selection-text=E4E1DDff    # Keep text readable on selection
border=22232Eff            # Muted, dark border
prompt=BDC3E6ff            # Soft periwinkle for prompt (optional, can use E4E1DDff for pure monochrome)
match=BDC3E6ff             # Soft periwinkle for match highlight (optional)

[border]
radius=10
width=4

[input]
background=22232Eff        # Slightly lighter input background for visibility
text=E4E1DDff              # Light text for input
border=22232Eff            # Muted dark border for input

